[project]
name = "blog_genration_crew"
version = "0.1.0"
description = "blog_genration_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.8.0",
    "fastapi>=0.128.0",
    "litellm>=1.75.3",
    "pydantic>=2.11.10",
    "uvicorn>=0.40.0",
]

[project.scripts]
blog_genration_crew = "blog_genration_crew.main:run"
run_crew = "blog_genration_crew.main:run"
train = "blog_genration_crew.main:train"
replay = "blog_genration_crew.main:replay"
test = "blog_genration_crew.main:test"
run_with_trigger = "blog_genration_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
